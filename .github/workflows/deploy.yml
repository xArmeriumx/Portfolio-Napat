name: CI/CD Pipeline - Portfolio

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "portfolio-quality-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma Schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/portfolio?schema=portfolio_cms_dev

      - name: Run Focused Tests
        run: npm test -- --reporter=dot

      - name: Typecheck
        run: npm run typecheck

      - name: Lint Code
        run: npm run lint

      - name: Build Production
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Public Smoke
        run: npm run test:e2e

      - name: Build Summary
        run: |
          echo "### Quality gates passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | `${{ github.ref_name }}` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | `${{ github.sha }}` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Node.js | 22.x |" >> "$GITHUB_STEP_SUMMARY"
